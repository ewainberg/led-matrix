<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>LED Matrix Debug</title>
  <style>
    body { font-family: system-ui, -apple-system, Arial, sans-serif; margin: 16px; }
    .meta { margin-bottom: 14px; }
    .row { display: grid; grid-template-columns: 140px 1fr; gap: 10px; padding: 10px 0; border-bottom: 1px solid #ddd; }
    .k { font-weight: 600; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
    .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; background: #eee; margin-left: 6px; }

    .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 10px 0 14px; }
    button { padding: 8px 10px; border: 1px solid #ccc; background: #f7f7f7; border-radius: 8px; cursor: pointer; }
    button:hover { background: #eee; }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    select { padding: 8px 10px; border: 1px solid #ccc; background: #fff; border-radius: 8px; }
    .status { margin-left: 6px; }

    /* Tetris */
    #tetris-section { margin-top: 20px; border-top: 2px solid #333; padding-top: 16px; }
    #tetris-section h3 { margin: 0 0 10px; }
    .tetris-controls { display: flex; gap: 24px; flex-wrap: wrap; margin: 12px 0; }
    .player-pad { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .player-pad .label { font-weight: 600; font-size: 13px; margin-bottom: 2px; }
    .player-pad .row-btns { display: flex; gap: 6px; }
    .player-pad button { min-width: 52px; }
    #tetris-scores { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; margin-top: 8px; }
    .t-over { color: #c00; font-weight: 700; }
  </style>
</head>
<body>
  <h2>LED Matrix Debug</h2>

  <div class="controls mono">
    <button id="pwrOn">Power On</button>
    <button id="pwrOff">Power Off</button>

    <button id="pause">Pause</button>
    <button id="resume">Resume</button>

    <button id="refreshNow">Refresh Now</button>
    <button id="breadAlertOn">Bread On</button>
    <button id="breadAlertOff">Bread Off</button>

    <button id="snakeAlertOn">Snake On</button>
    <button id="snakeAlertOff">Snake Off</button>

    <span class="status">Mode:</span>
    <select id="modeSel">
      <option value="">(auto)</option>
      <option value="weather">weather</option>
      <option value="bus">bus</option>
      <option value="excuse">excuse</option>
      <option value="message">message</option>
    </select>
    <button id="applyMode">Apply</button>
    <button id="clearMode">Clear</button>
  </div>

  <div id="meta" class="meta mono"></div>
  <div style="margin: 10px 0;">
    <div class="mono" style="margin-bottom:6px;">Preview (rendered framebuffer)</div>
    <img id="preview" style="image-rendering: pixelated; width: 640px; height: 32px; border:1px solid #ddd; border-radius:8px;" />
  </div>
  <div id="grid"></div>

  <!-- ================================================================ -->
  <!-- Tetris                                                            -->
  <!-- ================================================================ -->
  <div id="tetris-section">
    <h3>Two-Player Tetris</h3>

    <div class="controls mono">
      <button id="tetrisStart">Start Game</button>
      <button id="tetrisStop">Stop Game</button>
    </div>

    <div class="tetris-controls">
      <!-- Player 1 -->
      <div class="player-pad">
        <div class="label" style="color:#00dcff;">Player 1 (left)</div>
        <div class="row-btns">
          <button id="p1up">&#8593; Up</button>
          <button id="p1down">&#8595; Down</button>
        </div>
        <div class="row-btns">
          <button id="p1rcw">&#8635; Rotate CW</button>
          <button id="p1rccw">&#8634; Rotate CCW</button>
        </div>
      </div>

      <!-- Player 2 -->
      <div class="player-pad">
        <div class="label" style="color:#ff8c00;">Player 2 (right)</div>
        <div class="row-btns">
          <button id="p2up">&#8593; Up</button>
          <button id="p2down">&#8595; Down</button>
        </div>
        <div class="row-btns">
          <button id="p2rcw">&#8635; Rotate CW</button>
          <button id="p2rccw">&#8634; Rotate CCW</button>
        </div>
      </div>
    </div>

    <div id="tetris-scores">No active game.</div>

    <div class="controls mono" style="margin-top:10px; gap:12px;">
      <a href="/tetris/p1" target="_blank" style="color:#00dcff; text-decoration:none; border:1px solid #00dcff; padding:4px 10px; border-radius:4px;">Open P1 Controller ↗</a>
      <a href="/tetris/p2" target="_blank" style="color:#ff8c00; text-decoration:none; border:1px solid #ff8c00; padding:4px 10px; border-radius:4px;">Open P2 Controller ↗</a>
    </div>
  </div>

<script>
function esc(s) {
  return (s ?? '').toString()
    .replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
}

async function postJson(url, body) {
  const r = await fetch(url, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: body ? JSON.stringify(body) : '{}',
  });
  let j = null;
  try { j = await r.json(); } catch {}
  if (!r.ok) {
    const msg = (j && j.error) ? j.error : ('HTTP ' + r.status);
    throw new Error(msg);
  }
  return j;
}

async function tetrisAction(player, action) {
  try {
    await postJson('/api/tetris/action', {player, action});
  } catch(e) { console.warn('tetris action failed:', e.message); }
}

async function wireControls() {
  document.getElementById('breadAlertOn').onclick = async () => {
    try { await postJson('/api/bread_alert', {on:true}); await refresh(); } catch(e){ alert(e.message); }
  };
  document.getElementById('breadAlertOff').onclick = async () => {
    try { await postJson('/api/bread_alert', {on:false}); await refresh(); } catch(e){ alert(e.message); }
  };

  document.getElementById('snakeAlertOn').onclick = async () => {
    try { await postJson('/api/snake_alert', {on:true}); await refresh(); } catch(e){ alert(e.message); }
  };
  document.getElementById('snakeAlertOff').onclick = async () => {
    try { await postJson('/api/snake_alert', {on:false}); await refresh(); } catch(e){ alert(e.message); }
  };

  document.getElementById('pwrOn').onclick = async () => {
    try { await postJson('/api/power', {on:true}); await refresh(); } catch(e){ alert(e.message); }
  };
  document.getElementById('pwrOff').onclick = async () => {
    try { await postJson('/api/power', {on:false}); await refresh(); } catch(e){ alert(e.message); }
  };

  document.getElementById('pause').onclick = async () => {
    try { await postJson('/api/rotation', {paused:true}); await refresh(); } catch(e){ alert(e.message); }
  };
  document.getElementById('resume').onclick = async () => {
    try { await postJson('/api/rotation', {paused:false}); await refresh(); } catch(e){ alert(e.message); }
  };

  document.getElementById('refreshNow').onclick = async () => {
    try { await postJson('/api/refresh'); } catch(e){ alert(e.message); }
  };

  document.getElementById('applyMode').onclick = async () => {
    const mode = document.getElementById('modeSel').value;
    try { await postJson('/api/mode', {mode}); await refresh(); } catch(e){ alert(e.message); }
  };
  document.getElementById('clearMode').onclick = async () => {
    try { await postJson('/api/mode', {mode:""}); await refresh(); } catch(e){ alert(e.message); }
  };

  // Tetris game controls
  document.getElementById('tetrisStart').onclick = async () => {
    try { await postJson('/api/tetris/start'); await refreshTetris(); } catch(e){ alert(e.message); }
  };
  document.getElementById('tetrisStop').onclick = async () => {
    try { await postJson('/api/tetris/stop'); await refreshTetris(); } catch(e){ alert(e.message); }
  };

  document.getElementById('p1up').onclick    = () => tetrisAction(1, 'up');
  document.getElementById('p1down').onclick  = () => tetrisAction(1, 'down');
  document.getElementById('p1rcw').onclick   = () => tetrisAction(1, 'rotate_cw');
  document.getElementById('p1rccw').onclick  = () => tetrisAction(1, 'rotate_ccw');

  document.getElementById('p2up').onclick    = () => tetrisAction(2, 'up');
  document.getElementById('p2down').onclick  = () => tetrisAction(2, 'down');
  document.getElementById('p2rcw').onclick   = () => tetrisAction(2, 'rotate_cw');
  document.getElementById('p2rccw').onclick  = () => tetrisAction(2, 'rotate_ccw');
}

async function refresh() {
  const r = await fetch('/api/state');
  const s = await r.json();

  document.getElementById('preview').src = '/preview.png?t=' + Date.now();
  document.getElementById('meta').textContent =
    'mode=' + s.current_mode +
    ' | mode_duration=' + s.current_mode_duration_s + 's' +
    ' | clock=' + s.time_text +
    ' | updated=' + new Date(s._server_time_unix*1000).toLocaleTimeString()
    + (s.last_error ? ' | error=' + s.last_error : '')
    + (s.forced_mode ? ' | forced_mode=' + s.forced_mode : '')

  const modes = [
    ['weather', s.weather],
    ['bus', s.bus],
    ['excuse', s.excuse],
    ['message', s.message],
  ];

  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  for (const [name, snap] of modes) {
    const div = document.createElement('div');
    div.className = 'row';

    const extra = snap._scroll
      ? `<div class="mono">fit=${snap._scroll.needs_scroll ? 'scroll' : 'fits'} | text_px=${snap._scroll.text_width_px} | cycle_s=${snap._scroll.cycle_time_s.toFixed(2)} | total_s=${snap._scroll.total_time_s.toFixed(2)}</div>`
      : '';

    div.innerHTML = `
      <div class="k">${name}<span class="pill">${snap.ok ? 'ok' : 'err'}</span></div>
      <div>
        <div>${snap.display_text ? esc(snap.display_text) : '<span class="mono">(empty)</span>'}</div>
        <div class="mono">fetched_at=${new Date(snap.fetched_at_unix*1000).toLocaleTimeString()}</div>
        ${snap.error ? `<div class="mono">error=${esc(snap.error)}</div>` : ''}
        ${extra}
      </div>
    `;
    grid.appendChild(div);
  }
}

async function refreshTetris() {
  try {
    const r = await fetch('/api/tetris/state');
    const s = await r.json();
    const el = document.getElementById('tetris-scores');
    if (!s.active) {
      el.textContent = 'No active game.';
      return;
    }
    const p1over = s.p1.game_over ? ' <span class="t-over">GAME OVER</span>' : '';
    const p2over = s.p2.game_over ? ' <span class="t-over">GAME OVER</span>' : '';
    el.innerHTML =
      `P1: score=${s.p1.score} lines=${s.p1.lines}${p1over} &nbsp;|&nbsp; ` +
      `P2: score=${s.p2.score} lines=${s.p2.lines}${p2over} &nbsp;|&nbsp; ` +
      `tick=${s.tick_interval.toFixed(2)}s`;
  } catch(e) {}
}

wireControls();
refresh();
refreshTetris();
setInterval(refresh, 2000);
setInterval(refreshTetris, 1000);
</script>
</body>
</html>
